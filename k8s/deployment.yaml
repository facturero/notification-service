apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-node
  labels:
    app: notification-service-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service-node
  template:
    metadata:
      labels:
        app: notification-service-node
    spec:
      initContainers:
        - name: notification-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: name
      containers:
        - name: notification-service
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: name
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: notification-rabbitmq
                  key: url
            # SMTP de prueba (Mailtrap sandbox). Las credenciales viven en el
            # secret, no en el manifest: el CI actualizaría valor en texto plano
            # si estuvieran aquí. SMTP_PORT 2525 (sin TLS embebido).
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: port
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: user
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: password
            - name: FROM_EMAIL
              value: "no-reply@cmr.com"
            - name: FROM_NAME
              value: "CMR"
            - name: OTEL_SERVICE_NAME
              value: "notification-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: PORT
              value: "3011"
            - name: CORS_ORIGIN
              value: "https://crm.noahsolution.com"
          ports:
            - containerPort: 3011
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
