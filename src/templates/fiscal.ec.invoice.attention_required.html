<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La factura {{number}} necesita tu atención</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden">
          <tr>
            <td style="background-color:#b45309;padding:32px;text-align:center">
              <h1 style="color:#ffffff;margin:0;font-size:24px">Factura con problemas ante el SRI</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px">
              <p style="margin:0 0 16px;font-size:16px;color:#374151">Hola,</p>
              <p style="margin:0 0 16px;font-size:16px;color:#374151">
                La factura <strong>{{number}}</strong> necesita que alguien la revise.
              </p>
              <p style="margin:0 0 24px;font-size:14px;color:#6b7280">{{message}}</p>
              <p style="margin:0;font-size:14px;color:#9ca3af">
                Revisa el estado ante el SRI en el detalle de la factura.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#f9fafb;padding:16px 32px;text-align:center;border-top:1px solid #e5e7eb">
              <p style="margin:0;font-size:12px;color:#9ca3af">CMR — CRM &amp; Facturación Electrónica</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
