<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación a {{organizationName}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden">
          <tr>
            <td style="background-color:#4f46e5;padding:32px;text-align:center">
              <h1 style="color:#ffffff;margin:0;font-size:24px">Has sido invitado</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px">
              <p style="margin:0 0 16px;font-size:16px;color:#374151">Hola,</p>
              <p style="margin:0 0 16px;font-size:16px;color:#374151">
                Has sido invitado a unirte a <strong>{{organizationName}}</strong> en CMR.
              </p>
              <p style="margin:0 0 24px;font-size:16px;color:#374151">
                Haz clic en el siguiente botón para aceptar la invitación y completar tu registro:
              </p>
              <table cellpadding="0" cellspacing="0" style="margin:0 auto">
                <tr>
                  <td style="background-color:#4f46e5;border-radius:6px;padding:0">
                    <a href="{{inviteUrl}}"
                       style="display:inline-block;padding:14px 32px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold">
                      Aceptar invitación
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-size:14px;color:#9ca3af">
                Si no esperabas esta invitación, ignora este correo.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#f9fafb;padding:16px 32px;text-align:center;border-top:1px solid #e5e7eb">
              <p style="margin:0;font-size:12px;color:#9ca3af">CMR — CRM &amp; Facturación Electrónica</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
